name: payment-deployment

services:

  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 32091
      POSTGRES_DB: skill-exam-2400032091
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skill-exam-2400032091"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - payment-network

  exam-service:
    image: jahnavichinnam/docker-skill-exam-2400032091:latest
    build:
      context: ./soa-payment-project
      dockerfile: Dockerfile
    container_name: exam-service
    ports:
      - "9001:2006"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/skill-exam-2400032091
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 32091
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - payment-network

volumes:
  postgres_data:

networks:
  payment-network:
    driver: bridge